  recipe-header: "<g>altar recipes:</g>"
  recipe-line: "<gray>{id}: {inputs} -> {output} ({minutes} min)</gray>"
  recipe-created: "<g>recipe {id} created. hold the result item: /altar recipe output {id}, then add inputs with /altar recipe input {id}.</g>"
