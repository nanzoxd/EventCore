  bossbar: "<bb>✦ {item} | {time} |</bb> {coords}"
  hologram-idle: "<#AAAAAA>right-click with the items in your inventory</#AAAAAA>"
  hologram-any: "<#AAAAAA>right-click to open the altar</#AAAAAA>"
  hologram-busy: "<g>ritual {time}</g>"
