# EventCore main configuration. Everything here is also editable in-game: /eventcore gui
# Gradient palette used by the <g> tag in every message, title and bossbar.
# The two palettes everything is coloured with (titles, chat, GUIs, bossbars, holograms):
#   peach: #fffbf0 #fff1e0 #ffe4d5 #ffd7ca #ffcfca     gold: #d8b04a #e8c670 #f1d58f #f7e2ad #fff0cc
palette:            # peach -> gold (chat, titles)
  - "#fffbf0"
  - "#ffe4d5"
  - "#ffcfca"
  - "#f1d58f"
  - "#d8b04a"
# Bossbars use this gradient (<bb> tag): "Lootdrop Falling | 10 20 30"
bossbar-gradient: ["#d8b04a", "#fff0cc", "#d8b04a"]
# The [EventCore] label (chat prefix in messages.yml and the /eventcore gui title)
eventcore-gradient: ["#808080", "#C4C4C4", "#808080"]
# GUI colours (peach + gold only)
theme:
  main: "#d8b04a"
  soft: "#ffd7ca"
  good: "#f1d58f"
  bad: "#ffcfca"
  warn: "#e8c670"
  info: "#ffe4d5"
  white: "#fffbf0"
style:
  flatten-colors: true   # chat uses only the palette: red/green/gray... tags become text-color
  text-color: "#ffd7ca"
  small-caps: true      # convert template text to small caps (placeholder values are left alone)
  strip-bold: true      # never render bold
  title-times:          # ticks
    fade-in: 10
    stay: 70
    fade-out: 20
# Timezone for scheduled events (IANA name, e.g. Europe/Berlin, America/New_York)
timezone: "UTC"
# How running events are shown to players: BOSSBAR, ACTIONBAR or BOTH (an event can override with display-mode)
event-display: BOSSBAR
max-concurrent-events: 2
# Groups of events that can never run together (ids or aliases)
incompatible-events:
  - [anonymous, glow]
sounds:
  # default sound for chat broadcasts (a message can override it with its own sound section)
  broadcast: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
particles:
  compute-async: false  # compute particle offsets off-thread (spawn is always on the region thread)
  force: false          # show particles to players beyond normal range
# Discord webhook notifications (mini events, lootdrops, rituals). Set enabled: true and paste the webhook URL.
discord:
  enabled: false
  webhook-url: ""
  username: "EventCore"
  avatar-url: "https://kommodo.ai/i/VdcG7kcMYqx3eFvPyeTB"
  server-name: "My Server"
  mention: ""              # pinged on event start / lootdrop landed / ritual start, e.g. "<@&123456789>" or "@everyone"
  notify:            # start webhooks only, one per event
    event-start: true
    airdrop-falling: true
    ritual-start: true
    schedule-warning: false
    airdrop-landed: false
    airdrop-opened: false
    ritual-complete: false
    ritual-stop: false
  thumbnails:        # small image in the corner (thumbnail only; altar webhook is sent once all 3 coords are revealed)
    event: "https://kommodo.ai/i/VdcG7kcMYqx3eFvPyeTB"
    ritual: "https://plain-apac-prod-public.komododecks.com/202610/19/hOZKF5MLRfe4SxIfm8ol/image.png"
    lootdrop: "https://plain-apac-prod-public.komododecks.com/202610/19/f7kFK2IL9wvWHa3ogStY/image.png"
    altar: "https://plain-apac-prod-public.komododecks.com/202610/19/oZ1H7gY55K5VoKy5bR7q/image.png"
  colors:
    start: "#f1d58f"
    end: "#ffcfca"
    warn: "#e8c670"
    airdrop: "#d8b04a"
    ritual: "#ffd7ca"
