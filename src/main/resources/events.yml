  random_target:
    enabled: true
    display-name: "random target"
    description: "everyone hunts a random player, top killers are on the scoreboard"
    color: "#f5b7a5"
    aliases: [randomtarget, rtarget, target]
    duration-minutes: 30
    cooldown-minutes: 0
    display-mode: BOSSBAR     # the action bar belongs to the target display, so the countdown stays in the bossbar
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: RED
      style: NOTCHED_10
      gradient: ["#f5b7a5", "#ffe4d5"]
      countdown: true
    sounds:
      start: {sound: "entity.ender_dragon.growl", volume: 0.6, pitch: 1.2}
      end: {sound: "ui.toast.challenge_complete", volume: 0.8, pitch: 1.0}
    titles:                   # no "end" title on purpose: the top killer title is shown instead (messages.yml random-target.winner-title)
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
    messages:
      join:
        - "you are hunting a random player: their name and distance are in your action bar"
        - "your locator bar points at your target"
        - "if your target stays offline for 2 minutes you get a new one"
        - "the top 3 killers are on the scoreboard, the top killer is announced at the end"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
