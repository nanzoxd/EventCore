# Events. Every event has the same structure; "settings" holds event-specific options.
# Placeholders: {event} {description} {minutes} {time}  (airdrop adds {status} {coords} {crates})
scheduler:
  enabled: true
  warnings: [300, 60, 10]    # seconds before a scheduled start
  warning-sound: {sound: "block.note_block.pling", volume: 0.8, pitch: 1.2}
events:
  vulnerable:
    enabled: true
    display-name: "vulnerable"
    description: "everyone's max health is reduced"
    color: "#ffcfca"
    aliases: [vuln, frail, halfhearts]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: PINK
      style: NOTCHED_10
      gradient: ["#ffcfca", "#fff1e0"]
      countdown: true
    sounds:
      start: {sound: "entity.wither.spawn", volume: 0.8, pitch: 1.0}
      end: {sound: "entity.player.levelup", volume: 0.8, pitch: 1.0}
    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "everyone's max health is reduced to {hearts} hearts"
        - "you still regenerate normally, the limit only lasts until the event ends"
        - "it ends in {time}"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#ffcfca", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#ffcfca", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#ffcfca", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      hearts: 7.5          # 7.5 hearts = 15 hp
  shieldless:
    enabled: true
    display-name: "shieldless"
    description: "players cannot use shields"
    color: "#d8b04a"
    aliases: [shield, shields, noshield]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: YELLOW
      style: NOTCHED_6
      gradient: ["#d8b04a", "#f7e2ad"]
      countdown: true
    sounds:
      start: {sound: "item.shield.break", volume: 0.8, pitch: 1.0}
      end: {sound: "entity.player.levelup", volume: 0.8, pitch: 1.0}
    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "shields cannot be raised or used"
        - "you cannot craft new shields either"
        - "a raised shield is lowered automatically"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#d8b04a", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#d8b04a", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#d8b04a", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      block-raising: true
      block-damage-blocking: true
      block-crafting: true
      cooldown-ticks: 60
  golden_trees:
    enabled: true
    display-name: "golden tree"
    description: "leaves drop golden apples instead of apples"
    color: "#e8c670"
    aliases: [goldentrees, golden_trees, golden, trees, apples]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
