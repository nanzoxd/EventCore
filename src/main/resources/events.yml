  egg_hunt:
    enabled: true
    display-name: "egg hunt"
    description: "find the hidden eggs and climb the leaderboard"
    color: "#f1d58f"
    aliases: [egghunt, eggs, easter]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: YELLOW
      style: NOTCHED_10
      gradient: ["#d8b04a", "#fff0cc"]
      countdown: true
    sounds:
      start: {sound: "entity.chicken.egg", volume: 0.8, pitch: 1.0}
      end: {sound: "entity.player.levelup", volume: 0.8, pitch: 1.0}
    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "eggs are hidden in the event area, click one to collect it"
        - "every egg can be collected once, rarer eggs give better rewards"
        - "/egghunt leaderboard shows the top finders, it ends in {time}"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]
      days: [ALL]
      interval-minutes: 180
    settings:
      area:                      # /egghunt setarea [radius] sets these from where you stand (empty world = main world spawn)
        world: ""
        center-x: 0.0
        center-z: 0.0
        radius: 100              # square, blocks from the centre
        min-y: -60
        max-y: 320
      eggs:
        amount: 40               # total eggs, fixed spawns included
        per-player: true         # true: every player can find every egg once. false: first finder takes the egg
        end-when-all-found: true # only used when per-player is false
        underground-percent: 20  # chance an egg is hidden in a cave instead of on the surface
        min-cover: 1             # solid blocks touching the egg (walls / overhang); relaxed on the last attempts
        min-spacing: 8           # blocks between two eggs
        max-attempts: 30         # tries per egg before it is skipped
        per-tick-batch: 3        # placements started every 2 ticks (keeps chunk loading smooth)
        fixed-spawns: []         # "x,y,z" in the area world, always get an egg ("/egghunt addspawn")
        avoid-blocks: [CACTUS, MAGMA_BLOCK, CAMPFIRE, SOUL_CAMPFIRE, ICE, PACKED_ICE, BLUE_ICE]
      rarities:                  # weight = spawn chance relative to the others; material TURTLE_EGG (eggs: 1-4), DRAGON_EGG or PLAYER_HEAD + texture
        common:
          weight: 60
          display: "common"
          color: "#ffe4d5"
          material: TURTLE_EGG
          eggs: 1
          sound: {sound: "entity.chicken.egg", volume: 0.8, pitch: 1.2}
        uncommon:
          weight: 25
          display: "uncommon"
          color: "#ffd7ca"
          material: TURTLE_EGG
          eggs: 2
          sound: {sound: "entity.experience_orb.pickup", volume: 0.8, pitch: 1.1}
        rare:
          weight: 12
          display: "rare"
          color: "#e8c670"
          material: TURTLE_EGG
          eggs: 4
          sound: {sound: "entity.player.levelup", volume: 0.7, pitch: 1.4}
          reward: {items: ["EXPERIENCE_BOTTLE:8"], commands: []}
        legendary:
          weight: 3
          display: "legendary"
          color: "#d8b04a"
          material: DRAGON_EGG
          sound: {sound: "ui.toast.challenge_complete", volume: 0.8, pitch: 1.0}
          reward: {items: ["DIAMOND:4"], commands: []}
      hints:
        enabled: true            # a faint particle shows eggs you have not found yet when you are close
        range: 7.0
      announce:
        milestones: [10, 25, 50]   # server-wide message when a player reaches this many eggs
        time-warnings: [300, 60, 10]
      leaderboard:
        size: 10
        broadcast-minutes: 10      # 0 = never post the standings automatically
      rewards:
        milestones:                # given once per player when they reach this many eggs ({player}, {eggs} work in commands)
          - {eggs: 5, items: ["GOLDEN_CARROT:8"], commands: [], message: "<g>5 eggs found, here is a snack.</g>"}
          - {eggs: 15, items: ["EXPERIENCE_BOTTLE:32"], commands: []}
          - {eggs: 30, items: ["DIAMOND:5"], commands: []}
        placements:                # given when the event ends (place 1 = most eggs)
          - {place: 1, items: ["DIAMOND:16", "NETHERITE_INGOT:1"], commands: [], message: "<g>first place, congratulations!</g>"}
          - {place: 2, items: ["DIAMOND:8"], commands: []}
          - {place: 3, items: ["DIAMOND:4"], commands: []}
        participation:
          min-eggs: 1
          items: ["GOLD_INGOT:4"]
          commands: []
      anti-exploit:
        click-cooldown-ms: 250
        max-distance: 6.5          # blocks; clicks from further away are ignored
  natural_disaster:
    enabled: true
    display-name: "natural disaster"
    description: "last player standing inside a shrinking border"
    color: "#ffcfca"
    aliases: [disaster, nd, lastman]
    duration-minutes: 60
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time} | {alive} alive | border {radius}"
      color: RED
      style: NOTCHED_10
      gradient: ["#ffcfca", "#fff1e0"]
      countdown: true
    sounds:
      start: {sound: "entity.lightning_bolt.thunder", volume: 0.8, pitch: 1.0}
      end: {sound: "entity.player.levelup", volume: 0.8, pitch: 1.0}
    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "a natural disaster is running, the arena is closed to new players"
        - "the border shrinks over time, the last player standing wins"
        - "it ends in {time}"
      start:
        text: "<g>{event} has started: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    schedule:
      mode: off
      times: ["20:00"]
      days: [ALL]
      interval-minutes: 360
    settings:
      max-minutes: 60              # /disaster start <minutes> is capped to this
      protect-arena-entry: true    # players who are not in the event cannot teleport into the arena
      center:                      # border centre: /disaster setcenter
        world: ""
        x: 0.0
        z: 0.0
      arena:
        spawn:                     # /disaster setarena: where players are dropped (empty = around the centre)
          enabled: false
          x: 0.5
          y: 100.0
          z: 0.5
          mode: SURFACE            # SURFACE = highest block, FIXED = exactly the saved Y
      exit:                        # where everyone goes when the event ends or they are eliminated (/disaster setexit; empty world = main spawn)
        world: ""
      border:
        initial-radius: 40         # 40 blocks each side of the centre (80 x 80) at the start
        shrink-seconds: 3000       # ONE slow, steady shrink like the vanilla border (50 min), ending exactly at the minute below
        warning-distance: 5        # blocks from the border where the red vignette appears
        warnings: []               # seconds before a reduction begins (the single shrink starts at once, so none)
        warning-sound: {sound: "block.note_block.bell", volume: 0.8, pitch: 0.8}
        shrink-sound: {sound: "entity.ender_dragon.growl", volume: 0.4, pitch: 1.2}
        phases:                    # radius (blocks each side of the centre) reached at this minute
          - {minutes: 50, radius: 10}   # stops here, 10 blocks each side (20 x 20), and stays until the event ends
        push:                      # players are pushed away from the border so nobody can stand next to it
          enabled: true
          distance: 2.5            # blocks from the border where the push starts
          strength: 0.45           # how hard (velocity per move tick)
      participants:
        mode: ALL                  # ALL = every eligible online player, OPTIN = only players who used /disaster join first
        min-players: 0             # 0 = allow the event to start with any online player count
        exclude-gamemodes: [SPECTATOR]
        use-exempt-permission: false # true = exclude players with eventcore.disaster.exempt
        spread-radius: 35
        grace-seconds: 30          # no player-vs-player damage at the start
        entry-grace-seconds: 8     # border rules start after everyone has been teleported in
        heal-on-start: true
      elimination:
        out-of-border-damage: 2.0  # per second while outside the shrinking border
        out-of-border-seconds: 15  # eliminated after this long outside (0 = only the damage)
        on-eliminated: SPECTATE    # SPECTATE (watch inside the arena) or TELEPORT (straight to the exit)
        leave-arena-eliminates: true  # warping away from the arena counts as leaving the event
      winner:
        tie-breaker: [KILLS, HEALTH, CENTER]   # used when the timer runs out with several players alive
        fallback: RANDOM           # RANDOM or DRAW (everyone left tied wins)
      commands:
        restrict: true
        scope: EVENT_PLAYERS       # EVENT_PLAYERS or EVERYONE. Players with eventcore.bypass are never restricted
        allowed: [warp, warps, msg, tell, w, r, reply, rules, helpop]   # everything else is blocked while the event runs
      hazards:                     # disasters: they erode the arena slowly, in small shallow chunks (never down to bedrock)
        enabled: true
        start-after-seconds: 10    # the first two disasters begin this long after the event starts
        run-seconds: 120           # "2m": every disaster stays active this long (storms, hurricane and tornado run non-stop, meteors / geysers strike every min-max seconds); override per disaster with run-seconds
        max-active: 2              # only this many disasters at the same time = this many entries in the action bar ("hurricane: 2m | meteor: 2m")
        announce-seconds: 10       # the entry turns bold for the last N seconds of its run, then the next disaster of the cycle takes its slot
        max-damage: 12.0           # no hazard hit or fall does more than this (12 = 6 hearts)
        max-depth: 12              # hard limit: no disaster ever digs deeper than this many blocks below the surface
        dig-layers-per-tick: 3     # how fast a crater crumbles (lower = slower, more visible, lighter on the server)
        # ---- performance (lower = lighter on the server) ----
        blocks-per-tick: 120       # TOTAL blocks all disasters together may remove per server tick; the rest waits for the next tick
        particle-density: 0.5      # 0.1 - 1.0, scales the particles (fewer particles = less network + client lag)
        max-displays: 150          # max flying block / funnel entities alive at once
        # Every disaster has its own action bar colour (color: "#rrggbb"), shown in small caps.
        wind_charge:               # giant spinning wind charge falls, bursts and throws players away
          enabled: true
          color: "#7fffd4"
          min-seconds: 8           # one wind charge falls every min-max seconds (random) while it runs
          max-seconds: 12
          scale: 6.0
          fall-height: 35
          radius: 5.0
          damage: 4.0
          knockback: 1.6
          destroy-terrain: true
          crater-radius: 3
        meteor:                    # giant magma block: real crater with a small scorched pit in the middle
          enabled: true
          color: "#ff8c1a"
          min-seconds: 10          # one meteor falls every 10-15 seconds (random) for the whole run
          max-seconds: 15
          scale: 4.0
          radius: 5.0
          crater-radius: 3         # small hole
          shaft-radius: 1
          shaft-depth: 4
          destroy-terrain: true
          damage: 12.0
          fire-seconds: 4
          crater-seconds: 8
        lava_geyser:               # warning ring, then a REAL lava column that launches and burns (ground is restored after)
          enabled: true
          color: "#ff3030"
          min-seconds: 8           # one geyser erupts every min-max seconds (random) while it runs
          max-seconds: 12
          warning-seconds: 4
          duration-seconds: 6
          height: 14
          radius: 1.8
          vent-radius: 2.5         # the ground blows open here
          vent-depth: 9            # shallow vent with a small lava pool at the bottom
          destroy-terrain: true
          damage: 8.0
          launch-height: 40
        water_geyser:              # warning ring, then a REAL water column that launches players up
          enabled: true
          color: "#3aa0ff"
          min-seconds: 8
          max-seconds: 12
          warning-seconds: 3
          duration-seconds: 6
          height: 16
          radius: 1.8
          vent-radius: 2.5
          vent-depth: 7            # shallow vent with a small water pool at the bottom
          destroy-terrain: true
          launch-height: 50
        wind_storm:                # strong gust with wind streaks pushing everybody the same way
          enabled: true
          color: "#d8e2dc"
          strength: 0.35
          destroy-terrain: true    # rips random blocks out of the ground and blows them away
          rip-per-tick: 2
          rip-radius: 22
          max-blocks-per-player: 25
        tornado:                   # roams the arena for a while, rips blocks out, scours a shallow trench, throws players ~100 blocks
          enabled: true
          color: "#c2a878"
          height: 30
          radius: 7.0
          pull: 0.45
          speed: 0.2
          launch-height: 100       # how high the core throws players (blocks)
          launch-cooldown-seconds: 10
          max-blocks: 32           # picked-up blocks orbiting at once
          pick-radius: 5.0
          picks-per-interval: 2
          pick-interval-ticks: 4
          destroy-terrain: true
          dig-radius: 2            # width of the trench it scours along its path
          dig-depth: 3             # how deep that trench is
          damage: 4.0
        earthquake:                # the ground shakes, then a fissure opens a few blocks deep (deepest in the middle) with magma at the bottom
          enabled: true
          color: "#b5651d"
          min-seconds: 25          # one fissure every min-max seconds (random) while it runs
          max-seconds: 35
          shake-seconds: 6
          shake-radius: 45
          length: 44
          width: 4
          depth: 8
          columns-per-tick: 2
          dig-layers-per-tick: 3
        laser_sinkhole:            # red orbital laser locks on, burns, leaves a bowl-shaped sinkhole with a magma floor
          enabled: true
          color: "#ff2bd6"
          min-seconds: 15          # one laser strike every min-max seconds (random) while it runs
          max-seconds: 20
          charge-seconds: 4
          burn-seconds: 4
          radius: 6.0
          core-depth: 10           # depth in the middle of the bowl
          rim-depth: 6             # depth towards the edge
          damage: 12.0
        hurricane:                 # night + rain + a rotating spiral of wind that shoves players around
          enabled: true
          color: "#7b6cff"
          strength: 0.45
          destroy-terrain: true    # picks up random blocks all around and whirls them away
          rip-per-tick: 2
          rip-radius: 24
          max-blocks-per-player: 30
        meteor_shower:             # the sky darkens and many small meteors rain down non-stop, each one cratering the ground
          enabled: true
          color: "#ffd23f"
          every-seconds: 3         # a meteor this often while it runs (the shower is the only dense one)
          scale: 3.0
          radius: 4.0
          crater-radius: 2
          shaft-radius: 1
          shaft-depth: 3
          destroy-terrain: true
          damage: 10.0
          fire-seconds: 3
          crater-seconds: 4
        thunderstorm:              # dark storm; lightning locks onto every player and strikes where they stand
          enabled: true
          color: "#9dff4a"
          strike-interval-seconds: 2.5   # per player
          warning-seconds: 1.2           # ring + crackle before the bolt lands (run!)
          hit-radius: 2.5
          damage: 8.0
          crater-radius: 2
          ambient-strikes: 3             # extra random bolts per player that wreck the terrain
        lightning:
          enabled: false           # optional: harmless-looking strikes that damage players standing close
          interval-seconds: 20
          offset: 6.0
          radius: 3.0
          damage: 6.0
      rewards:
        winner:
          items: ["NETHERITE_INGOT:2", "DIAMOND:32"]
          commands: []
          message: "<g>you survived the natural disaster!</g>"
