    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "everyone shares the same name and skin"
        - "chat names, tab list and nametags are hidden"
        - "join, quit, death and advancement messages are hidden"
