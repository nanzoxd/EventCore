      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#d8b04a", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#d8b04a", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
