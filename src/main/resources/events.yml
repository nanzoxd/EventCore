      mode: off
      times: ["20:00"]
      days: [ALL]
      interval-minutes: 360
    settings:
      max-minutes: 60              # /disaster start <minutes> is capped to this
      protect-arena-entry: true    # players who are not in the event cannot teleport into the arena
      center:                      # border centre: /disaster setcenter
        world: ""
        x: 0.0
        z: 0.0
      arena:
        spawn:                     # /disaster setarena: where players are dropped (empty = around the centre)
          enabled: false
          x: 0.5
          y: 100.0
          z: 0.5
          mode: SURFACE            # SURFACE = highest block, FIXED = exactly the saved Y
      exit:                        # where everyone goes when the event ends or they are eliminated (/disaster setexit; empty world = main spawn)
        world: ""
      border:
        initial-radius: 40         # 40 blocks each side of the centre (80 x 80) at the start
        shrink-seconds: 3000       # ONE slow, steady shrink like the vanilla border (50 min), ending exactly at the minute below
        warning-distance: 5        # blocks from the border where the red vignette appears
        warnings: []               # seconds before a reduction begins (the single shrink starts at once, so none)
        warning-sound: {sound: "block.note_block.bell", volume: 0.8, pitch: 0.8}
        shrink-sound: {sound: "entity.ender_dragon.growl", volume: 0.4, pitch: 1.2}
        phases:                    # radius (blocks each side of the centre) reached at this minute
          - {minutes: 50, radius: 10}   # stops here, 10 blocks each side (20 x 20), and stays until the event ends
        push:                      # players are pushed away from the border so nobody can stand next to it
          enabled: true
          distance: 2.5            # blocks from the border where the push starts
          strength: 0.45           # how hard (velocity per move tick)
      participants:
        # nobody is teleported automatically: every online player (and everyone who joins later) gets a Yes / No menu, /tpdisaster opens it again
        # a player who pressed Yes and died or left cannot enter a second time during the same event
        join-window-seconds: 60    # no "last player standing" win before this many seconds (people are still choosing in the menu)
        exclude-gamemodes: [SPECTATOR]
        use-exempt-permission: false # true = exclude players with eventcore.disaster.exempt
        spread-radius: 35
        grace-seconds: 30          # no player-vs-player damage at the start
        entry-grace-seconds: 8     # border rules start after everyone has been teleported in
        heal-on-start: true
      elimination:
        out-of-border-damage: 2.0  # per second while outside the shrinking border
        out-of-border-seconds: 15  # eliminated after this long outside (0 = only the damage)
        on-eliminated: SPECTATE    # SPECTATE (watch inside the arena) or TELEPORT (straight to the exit)
        leave-arena-eliminates: true  # warping away from the arena counts as leaving the event
      winner:
        tie-breaker: [KILLS, HEALTH, CENTER]   # used when the timer runs out with several players alive
        fallback: RANDOM           # RANDOM or DRAW (everyone left tied wins)
      commands:
        restrict: true
        scope: EVENT_PLAYERS       # EVENT_PLAYERS or EVERYONE. Players with eventcore.bypass are never restricted
        allowed: [warp, warps, msg, tell, w, r, reply, rules, helpop]   # everything else is blocked while the event runs
      hazards:                     # disasters: they erode the arena slowly, in small shallow chunks (never down to bedrock)
        enabled: true
        start-after-seconds: 10    # the first two disasters begin this long after the event starts
        run-seconds: 120           # "2m": every disaster stays active this long (storms, hurricane and tornado run non-stop, meteors / geysers strike every min-max seconds); override per disaster with run-seconds
        max-active: 2              # only this many disasters at the same time = this many entries in the action bar ("hurricane: 2m | meteor: 2m")
        track-chance: 0.25         # chance that a disaster is aimed at a player (also how often the tornado chases one); otherwise it lands / roams on its own
        announce-seconds: 10       # the entry turns bold for the last N seconds of its run, then the next disaster of the cycle takes its slot
        pause-chance: 0.4          # chance that a finished round is followed by a pause with NO disasters, so players can fight
        pause-min-seconds: 25      # how long such a pause lasts (random between min and max), shown as "pause: 30s" in the action bar
        pause-max-seconds: 45
        max-damage: 20.0           # highest damage of a direct hit (20 = 10 hearts; armor still reduces it)
        max-fall-damage: 12.0      # highest fall damage after being launched (12 = 6 hearts), so launches hurt but do not kill
        max-depth: 12              # hard limit: no disaster ever digs deeper than this many blocks below the surface
        dig-layers-per-tick: 3     # how fast a crater crumbles (lower = slower, more visible, lighter on the server)
        # ---- performance (lower = lighter on the server) ----
        blocks-per-tick: 120       # TOTAL blocks all disasters together may remove per server tick; the rest waits for the next tick
        particle-density: 0.5      # 0.1 - 1.0, scales the particles (fewer particles = less network + client lag)
        max-displays: 150          # max flying block / funnel entities alive at once
        # Every disaster has its own action bar colour (color: "#rrggbb"), shown in small caps.
        wind_charge:               # giant spinning wind charge falls, bursts and throws players away
          enabled: true
          color: "#7fffd4"
          min-seconds: 8           # one wind charge falls every min-max seconds (random) while it runs
          max-seconds: 12
          scale: 6.0
          fall-height: 35
          radius: 5.0
          damage: 8.0
          knockback: 1.6
          destroy-terrain: true
          crater-radius: 3
        meteor:                    # giant falling rock: real crater with a small pit in the middle (no magma blocks are placed)
          enabled: true
          color: "#ff8c1a"
          min-seconds: 10          # one meteor falls every 10-15 seconds (random) for the whole run
          max-seconds: 15
          scale: 4.0
          radius: 5.0
          crater-radius: 3         # small hole
          shaft-radius: 1
          shaft-depth: 4
          destroy-terrain: true
          damage: 20.0
          fire-seconds: 4
          crater-seconds: 8
        lava_geyser:               # warning ring, then a REAL lava column that launches and burns (ground is restored after)
          enabled: true
          color: "#ff3030"
          min-seconds: 8           # one geyser erupts every min-max seconds (random) while it runs
          max-seconds: 12
          warning-seconds: 4
          duration-seconds: 6
          height: 14
          radius: 1.8
          vent-radius: 2.5         # the ground blows open here
          vent-depth: 9            # shallow vent with a small lava pool at the bottom
          destroy-terrain: true
          damage: 12.0
          launch-height: 40
        water_geyser:              # warning ring, then a REAL water column that launches players up
          enabled: true
          color: "#3aa0ff"
          min-seconds: 8
          max-seconds: 12
          warning-seconds: 3
          duration-seconds: 6
          height: 16
          radius: 1.8
          vent-radius: 2.5
          vent-depth: 7            # shallow vent with a small water pool at the bottom
          destroy-terrain: true
          launch-height: 50
        wind_storm:                # strong gust with wind streaks pushing everybody the same way
          enabled: true
          color: "#d8e2dc"
          strength: 0.35
          destroy-terrain: true    # rips random blocks out of the ground and blows them away
          rip-per-tick: 2
          rip-radius: 22
          max-blocks-per-player: 25
        tornado:                   # roams the arena for a while, rips blocks out, scours a shallow trench, throws players ~100 blocks
          enabled: true
          color: "#c2a878"
          height: 30
          radius: 7.0
          pull: 0.45
          speed: 0.2
          launch-height: 100       # how high the core throws players (blocks)
          launch-cooldown-seconds: 10
          max-blocks: 32           # picked-up blocks orbiting at once
          pick-radius: 5.0
          picks-per-interval: 2
          pick-interval-ticks: 4
          destroy-terrain: true
          dig-radius: 1            # width of the trench it scours along its path (small = weak digging)
          dig-depth: 1             # how deep that trench is (1 = it only scuffs the top layer)
          damage: 8.0
        earthquake:                # the ground shakes, then a fissure opens a few blocks deep (deepest in the middle) 
          enabled: true
          color: "#b5651d"
          min-seconds: 25          # one fissure every min-max seconds (random) while it runs
          max-seconds: 35
          shake-seconds: 6
          shake-radius: 45
          underground-hint: true   # players who are still underground when it starts get the hint "do not stay underground" (once per earthquake)
          underground-depth: 5     # blocks below the surface that count as underground
          length: 44
          width: 4
          depth: 8
          columns-per-tick: 2
          dig-layers-per-tick: 3
        laser_sinkhole:            # red orbital laser locks on, burns, leaves a bowl-shaped sinkhole
          enabled: true
          color: "#ff2bd6"
          min-seconds: 15          # one laser strike every min-max seconds (random) while it runs
          max-seconds: 20
          charge-seconds: 4
          burn-seconds: 4
          radius: 6.0
          core-depth: 10           # depth in the middle of the bowl
          rim-depth: 6             # depth towards the edge
          damage: 20.0
        hurricane:                 # night + rain + a rotating spiral of wind that shoves players around
          enabled: true
          color: "#7b6cff"
          strength: 0.45
          destroy-terrain: true    # picks up random blocks all around and whirls them away
          rip-per-tick: 2
          rip-radius: 24
          max-blocks-per-player: 30
        meteor_shower:             # the sky darkens and many small meteors rain down non-stop, each one cratering the ground
          enabled: true
          color: "#ffd23f"
          every-seconds: 3         # a meteor this often while it runs (the shower is the only dense one)
          scale: 3.0
          radius: 4.0
          crater-radius: 2
          shaft-radius: 1
          shaft-depth: 3
          destroy-terrain: true
          damage: 16.0
          fire-seconds: 3
          crater-seconds: 4
        thunderstorm:              # dark storm; lightning marks a ring near each player, then strikes inside it (it does not follow the player)
          enabled: true
          color: "#9dff4a"
          strike-interval-seconds: 4.0   # per player (was 2.5)
          warning-seconds: 2.0           # the ring stays where it is and the bolt lands in it: step out of it (was 1.2)
          track-chance: 0.4              # chance that a bolt is aimed near the player at all, otherwise it lands somewhere around (lower = less tracking)
          aim-offset: 3.0                # an aimed bolt lands up to this many blocks from where the player stood when it locked on
          random-radius: 14.0            # how far an unaimed bolt can land from the player
          hit-radius: 2.5
          damage: 14.0
          crater-radius: 2
          ambient-strikes: 2             # extra random bolts per player that wreck the terrain (was 3)
        lightning:
          enabled: false           # optional: harmless-looking strikes that damage players standing close
          interval-seconds: 20
          offset: 6.0
          radius: 3.0
          damage: 6.0
      rewards:
        winner:
          items: ["NETHERITE_INGOT:2", "DIAMOND:32"]
          commands: []
          message: "<g>you survived the natural disaster!</g>"
  chat_question:
    enabled: true
    display-name: "chat games"
    description: "answer the question in chat first and win golden apples"
    color: "#f1d58f"
    gradient: ["#2E9BFF", "#D4ECFF", "#2E9BFF"]   # title gradient (dark, light, dark)
    aliases: [chatquestion, chatgames, chat, trivia, quiz]
    duration-minutes: 10
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: YELLOW
      style: NOTCHED_10
      gradient: ["#d8b04a", "#f7e2ad"]
      countdown: true
    sounds:
      start: {sound: "block.note_block.bell", volume: 0.8, pitch: 1.3}
      end: {sound: "ui.toast.challenge_complete", volume: 0.8, pitch: 1.0}
    titles:
      start: {title: "<gradient:{gradient_raw}>{event}</gradient>", subtitle: "<gradient:{gradient_raw}>{description}</gradient>"}
      end: {title: "<gradient:{gradient_raw}>{event} ended</gradient>", subtitle: ""}
      winner: {title: "<gradient:{gradient_raw}>{event}</gradient>", subtitle: "<gradient:{gradient_raw}>{player} won</gradient>", stay: 60}   # shown to everyone when a question is answered
    messages:
      join:
        - "questions appear in chat, type the answer in chat"
        - "the first correct answer wins golden apples"
        - "it ends in {time}"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
      question:                  # the question is sent in chat only (no title, no action bar). {number} {question} {seconds}
        text: "<g>question {number}</g> <gray>-</gray> <white>{question}</white> <gray>({seconds}s)</gray>"
        sound: {sound: "block.note_block.pling", volume: 1.0, pitch: 1.6}
      winner:
        text: "<g>{player} answered correctly and won {amount} golden apples!</g>"
        sound: {sound: "entity.player.levelup", volume: 0.8, pitch: 1.2}
      expired:
        text: "<g>time is up, nobody answered. the answer was {answer}.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.7, pitch: 0.8}
    start-animation:
