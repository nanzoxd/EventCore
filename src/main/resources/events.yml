        - "chat shows who is hitting it and the top 3 hitters"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.3, pitch: 1.0}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.3, pitch: 0.8}
    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#d8b04a", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#d8b04a", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#d8b04a", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      bossbar-text: "Lootdrop {status} | {coords}"   # incoming: {coords} = countdown, landed: crate coordinates
      bossbar-text-falling: "Lootdrop {status} | {coords} | {fall_time}"   # while a crate falls: coordinates + time to land
      status:
        waiting: "Incoming"
        falling: "Falling"
        landed: "Landed"
        done: "Done"
      spawn:
        incoming-seconds: 30      # "Lootdrop Incoming | 30 Seconds" before the first crate starts to fall
        interval-seconds: 120
        max-crates: 5
        stop-spawning-seconds-before-end: 60
        mode: AREA             # AREA (square around world spawn) or AROUND_PLAYER
        worlds: []
        min-distance: 30.0
        max-distance: 120.0
        area:
          world: "world"
          use-world-spawn: true   # centre = world spawn, otherwise center-x / center-z
          center-x: 0.0
          center-z: 0.0
          half-size: 4000         # blocks to EACH side of the centre (a 8000 x 8000 square)
        avoid-liquids: true
        max-attempts: 8
      fall:
        min-height: 100.0         # spawn height above the surface (never below 100)
        duration-minutes: 25.0    # smooth descent: the crate takes exactly this long to reach the ground
        trail-interval-ticks: 2
        sound-range: 0            # 0 = play at the plain volume below (quiet); above 0 raises the volume so it carries that far
        sound-height: 25.0        # the falling sound only plays when the crate is this close above the ground
        marker:                   # ring on the surface that shows where the crate lands (tier coloured)
          enabled: true
          use-tier-color: true
          interval-ticks: 10
          layers:
            ring: {shape: ring, particle: DUST, size: 1.6, radius: 4.0, count: 56, height: 0.15, particles-min: 1, particles-max: 1, force: true}
            inner: {shape: ring, particle: DUST, size: 1.2, radius: 2.0, count: 28, height: 0.15, particles-min: 1, particles-max: 1, force: true}
        easing: LINEAR         # LINEAR or EASE_IN
        sound: {sound: "item.elytra.flying", volume: 0.35, pitch: 0.5}
        sound-interval-ticks: 20
        trail: {shape: scatter, particle: CLOUD, count: 6, radius-min: 0.0, radius-max: 0.5, y-min: 0.0, y-max: 0.8, particles-min: 1, particles-max: 1}
        hologram-offset: 2.0
        announce:                 # sent the moment a crate starts to fall: where it is coming down
          show-title: true
          chat:
            text: "<g>{tier_plain} lootdrop is falling at {world} {x} {y} {z}. Lands in {time_fmt}.</g>"
            sound: {sound: "entity.firework_rocket.launch", volume: 0.3, pitch: 0.8}
          title: {title: "<g>{tier_plain} lootdrop falling</g>", subtitle: "<g>{x} {y} {z}</g>"}
        flare: {shape: spiral, particle: END_ROD, count: 30, radius: 0.3, height: 0.0, rise: 25.0, turns: 6.0, spin: 12.0, particles-min: 1, particles-max: 1}
      parachute:                 # chickens leashed to the crate (shulker)
        enabled: true
        chickens: 5
        height: 3.2
        radius: 1.4
      land:
        smoke: {shape: spiral, particle: CLOUD, count: 24, radius: 0.4, height: 0.0, rise: 18.0, turns: 4.0, spin: 8.0, particles-min: 1, particles-max: 1}
        sound: {sound: "entity.generic.explode", volume: 0.5, pitch: 0.6}
        shockwave:
          enabled: true
          ticks: 12
          radius-start: 0.5
          radius-end: 7.0
          layer: {shape: ring, particle: CLOUD, count: 40, height: 0.2, particles-min: 1, particles-max: 1}
        title: {title: "<g>{tier_plain} lootdrop landed</g>", subtitle: "<g>{x} {y} {z}</g>"}
        chat:
          text: "<g>{tier_plain} lootdrop landed at {world} {x} {y} {z}</g>"
          sound: {sound: "block.note_block.bell", volume: 0.3, pitch: 0.8}
        broadcast-title: true
        lock-seconds: 3
        expire-seconds: 600
        ambient-sound: {sound: "item.elytra.flying", volume: 0.3, pitch: 0.5}   # low-pitched elytra wind next to the landed crate
        ambient-interval-ticks: 60
        ambient-range: 0          # 0 = quiet plain volume
        sound-range: 0            # 0 = plain volume (quiet); above 0 = carries that many blocks
      hit:
        damage-per-hit: 1
        announce-first-hit: true   # chat line the first time each player hits a crate
        first-chat:
          text: "<g>{player} is hitting a {tier_plain} lootdrop at {x} {y} {z}</g>"
          sound: {sound: "none"}
        top-count: 3               # chat ranking when the crate opens: 1-2-3
        top-header: "<g>top hitters of the {tier_plain} lootdrop:</g>"
        top-line: "<g>#{rank} {player} - {damage} hits</g>"
        sound: {sound: "block.anvil.hit", volume: 0.35, pitch: 1.2}
        actionbar: "<n>{bar} <color:#fffbf0>{hp}</color><color:#ffd7ca>/{max}</color></n>"
      open:
        sound: {sound: "block.shulker_box.open", volume: 0.6, pitch: 1.0}
        chat:
          text: "<g>{player} opened a {tier_plain} lootdrop</g>"
          sound: {sound: "entity.player.levelup", volume: 0.3, pitch: 1.0}
        particles:
          burst: {shape: burst, particle: DUST, color: "#fffbf0", size: 1.0, count: 30, radius-min: 0.5, radius-max: 2.0, height: 0.8, particles-min: 1, particles-max: 1}
      messages:
        show-still-falling: true
        still-falling: "<color:#ffcfca>this crate is still falling!</color>"
        locked: "<color:#ffcfca>this crate is locked for {seconds}s</color>"
      hologram:
        enabled: true
        offset: 1.9
        scale: 1.1
        falling: "<n>{tier} <color:#fffbf0>Crate</color><newline><color:#ffd7ca>Landing in <color:#fffbf0>{time_fmt}</color></color></n>"
        locked: "<n>{tier} <color:#fffbf0>Crate</color><newline><color:#ffcfca>Locked <color:#fffbf0>{seconds}s</color></color></n>"
        ready: "<n>{tier} <color:#fffbf0>Crate</color><newline>{bar}<newline><color:#fffbf0>{hp}</color><color:#ffd7ca>/{max} HP</color><newline><color:#f1d58f>Punch to open</color></n>"
      tiers:
        iron:
          display-name: "iron"
          rarity: "common"
          weight: 55.0
          health: 40
          shulker-color: YELLOW
          gradient: ["#ffe4d5", "#ffcfca"]
          trail: {shape: scatter, particle: DUST, color: "#ffd7ca", size: 1.0, count: 8, radius-min: 0.0, radius-max: 0.6, y-min: 0.0, y-max: 0.8, particles-min: 1, particles-max: 2}
          land-particles:
            ring: {shape: ring, particle: DUST, color: "#ffd7ca", size: 1.2, count: 30, radius: 2.0, height: 0.3, particles-min: 1, particles-max: 1}
          sounds:
            land: {sound: "entity.generic.explode", volume: 0.5, pitch: 0.7}
            hit: {sound: "block.anvil.hit", volume: 0.35, pitch: 1.8}
            open: {sound: "block.shulker_box.open", volume: 0.6, pitch: 1.0}
        gold:
          display-name: "gold"
          rarity: "uncommon"
          weight: 28.0
          health: 60
          shulker-color: ORANGE
          gradient: ["#f1d58f", "#d8b04a"]
          trail: {shape: scatter, particle: DUST, color: "#e8c670", size: 1.0, count: 8, radius-min: 0.0, radius-max: 0.6, y-min: 0.0, y-max: 0.8, particles-min: 1, particles-max: 2}
          land-particles:
            ring: {shape: ring, particle: DUST, color: "#e8c670", size: 1.2, count: 30, radius: 2.0, height: 0.3, particles-min: 1, particles-max: 1}
          sounds:
            land: {sound: "entity.generic.explode", volume: 0.5, pitch: 0.65}
            hit: {sound: "block.anvil.hit", volume: 0.35, pitch: 1.5}
            open: {sound: "block.shulker_box.open", volume: 0.6, pitch: 1.0}
        diamond:
          display-name: "diamond"
          rarity: "rare"
          weight: 13.0
          health: 90
          shulker-color: RED
          gradient: ["#fff0cc", "#f7e2ad"]
          trail: {shape: scatter, particle: DUST, color: "#fff0cc", size: 1.0, count: 8, radius-min: 0.0, radius-max: 0.6, y-min: 0.0, y-max: 0.8, particles-min: 1, particles-max: 2}
          land-particles:
            ring: {shape: ring, particle: DUST, color: "#fff0cc", size: 1.2, count: 30, radius: 2.0, height: 0.3, particles-min: 1, particles-max: 1}
          sounds:
