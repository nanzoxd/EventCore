      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      name: "Anonymous"
      chat-format: "<color:#ffd7ca>{name}</color> <color:#ffd7ca>»</color> "
      hide-join-quit: true
      hide-death-messages: true
      hide-advancements: true
      tablist-mode: ANON   # ANON, BLANK or OFF
      reveal-to-admins: true   # players with eventcore.bypass see the real name in brackets
      skin:                    # everyone gets this skin while the event runs (needs Paper's profile API)
        enabled: true
        url: "http://textures.minecraft.net/texture/1a4af718455d4aab528e7a61f86fa25e6a369d1768dcb13f7df319a713eb810b"
        slim: false
  glow:
    enabled: true
    display-name: "glow"
    description: "everyone glows"
    color: "#f1d58f"
    aliases: [glowing]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
