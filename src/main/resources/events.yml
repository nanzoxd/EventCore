        ring: {shape: ring, particle: DUST, color: "#e8c670", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#e8c670", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#e8c670", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      drop-item: GOLDEN_APPLE
      replace-apples: true
      drop-chance: 6.0     # percent chance per broken/decayed leaf (vanilla apple chance is about 0.5)
      amount-min: 1
      amount-max: 1
      block-swap:          # optional client-side visual swap (never changes the world)
        enabled: false
        from: [OAK_LEAVES, DARK_OAK_LEAVES]
        to: FLOWERING_AZALEA_LEAVES
        radius: 8
        interval-seconds: 5
  anonymous:
    enabled: true
