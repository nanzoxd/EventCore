    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#ffd7ca", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#ffd7ca", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#ffd7ca", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
