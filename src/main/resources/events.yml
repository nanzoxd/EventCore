    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "leaves drop golden apples instead of apples"
        - "break or let leaves decay to get them"
        - "shears and silk touch still drop the leaf itself"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#e8c670", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#e8c670", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#e8c670", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      drop-item: GOLDEN_APPLE
      replace-apples: true
      drop-chance: 6.0     # percent chance per broken/decayed leaf (vanilla apple chance is about 0.5)
      amount-min: 1
      amount-max: 1
      block-swap:          # optional client-side visual swap (never changes the world)
        enabled: false
        from: [OAK_LEAVES, DARK_OAK_LEAVES]
        to: FLOWERING_AZALEA_LEAVES
        radius: 8
        interval-seconds: 5
  anonymous:
    enabled: true
    display-name: "anonymous"
    description: "everyone shares the same name"
    color: "#ffd7ca"
    aliases: [anon, anonym, hidden]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: PINK
      style: NOTCHED_12
      gradient: ["#ffd7ca", "#fffbf0"]
      countdown: true
    sounds:
      start: {sound: "entity.enderman.teleport", volume: 0.8, pitch: 1.0}
      end: {sound: "entity.player.levelup", volume: 0.8, pitch: 1.0}
    titles:
      start: {title: "<g>{event}</g>", subtitle: "<g>{description}</g>"}
      end: {title: "<g>{event} ended</g>", subtitle: ""}
    messages:
      join:
        - "everyone shares the same name and skin"
        - "chat names, tab list and nametags are hidden"
        - "join, quit, death and advancement messages are hidden"
      start:
        text: "<g>{event} has started for {minutes} minutes: {description}</g>"
        sound: {sound: "block.note_block.chime", volume: 0.6, pitch: 1.4}
      end:
        text: "<g>{event} has ended.</g>"
        sound: {sound: "block.note_block.bass", volume: 0.6, pitch: 1.0}
    start-animation:
      enabled: true
      duration-ticks: 40
      interval-ticks: 5
      layers:
        ring: {shape: ring, particle: DUST, color: "#ffd7ca", size: 1.0, count: 36, radius: 2.5, radius-jitter: 0.1, y-jitter: 0.05, height: 1.0, particles-min: 1, particles-max: 1, spin: 10.0}
        burst: {shape: burst, particle: DUST, color: "#ffd7ca", size: 0.8, count: 20, radius-min: 0.5, radius-max: 2.0, height: 1.0, particles-min: 1, particles-max: 1}
    aura:
      enabled: false
      interval-ticks: 10
      layers:
        helix: {shape: helix, particle: DUST, color: "#ffd7ca", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      name: "Anonymous"
      chat-format: "<color:#ffd7ca>{name}</color> <color:#ffd7ca>»</color> "
      hide-join-quit: true
      hide-death-messages: true
      hide-advancements: true
      tablist-mode: ANON   # ANON, BLANK or OFF
      reveal-to-admins: true   # players with eventcore.bypass see the real name in brackets
      skin:                    # everyone gets this skin while the event runs (needs Paper's profile API)
        enabled: true
        url: "http://textures.minecraft.net/texture/1a4af718455d4aab528e7a61f86fa25e6a369d1768dcb13f7df319a713eb810b"
        slim: false
  glow:
    enabled: true
    display-name: "glow"
    description: "everyone glows"
    color: "#f1d58f"
    aliases: [glowing]
    duration-minutes: 30
    cooldown-minutes: 0
    bossbar:
      enabled: true
      text: "{event} : {time}"
      color: YELLOW
      style: NOTCHED_20
      gradient: ["#f1d58f", "#fffbf0"]
