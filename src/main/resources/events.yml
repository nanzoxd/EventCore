      layers:
        helix: {shape: helix, particle: DUST, color: "#d8b04a", size: 0.6, count: 16, radius: 0.8, height: 0.1, rise: 2.0, turns: 2.0, spin: 20.0, particles-min: 1, particles-max: 1}
    schedule:
      mode: off            # off | times | interval
      times: ["19:00"]     # "19:00" or "SAT 20:00"
      days: [ALL]          # ALL or MONDAY, TUESDAY ...
      interval-minutes: 180
    settings:
      block-raising: true
      block-damage-blocking: true
      block-crafting: true
      cooldown-ticks: 60
  golden_trees:
    enabled: true
    display-name: "golden tree"
    description: "leaves drop golden apples instead of apples"
    color: "#e8c670"
    gradient: ["#E8B923", "#FFF3B0", "#E8B923"]   # title gradient (dark, light, dark)
