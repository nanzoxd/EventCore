# Ritual Creator + bounty GUIs. Clean gray and white style, small caps is applied automatically (config.yml style.small-caps).
# Layout of every item: name (gold to peach gradient) | short description (gray) | blank line | mouse hints.
# Names/lore support MiniMessage and {placeholders}; mouse icons are {ml_raw} {mr_raw}. The admin menu (/eventcore gui) is built in code, colours in config.yml theme.
# Layout matches RitualCreator.sk: stop 10 | timer 12 | creator 13 | particle colours 14 | end 16
ritual-main:
  title: "<gradient:#d8b04a:#f1d58f:#ffd7ca>ritual creator</gradient>"
  rows: 3
  items:
    cancel:
      slot: 10
      material: RED_CONCRETE
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>stop ritual</gradient>"
      lore: ["<color:#a8a8a8>ends the active ritual</color>", "<color:#7a7a7a>no completion reward</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to stop</color>"]
    time:
      slot: 12
      material: CLOCK
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>ritual timer</gradient>"
      lore: ["<color:#a8a8a8>{minutes} minutes</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to +1 minute</color>", "{mr_raw}  <color:#a8a8a8>RMB to -1 minute</color>"]
    creation:
      slot: 13
      material: BEACON
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>ritual creator</gradient>"
      lore: ["<color:#a8a8a8>place an item to create a ritual</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to open the item selector</color>"]
    palette:
      slot: 14
      material: NETHER_STAR
      name: "<color:{palette_color_raw}>{palette_label}</color>"
      lore: ["{ml_raw}  <color:#a8a8a8>LMB to cycle particle colors</color>"]
    submit:
      slot: 16
      material: GREEN_CONCRETE
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>end ritual</gradient>"
      lore: ["<color:#a8a8a8>completes the active ritual</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to complete now</color>"]
ritual-select:
  title: "<gradient:#d8b04a:#f1d58f:#ffd7ca>select an item</gradient>"
  rows: 3
  input-slot: 13
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
# Bounty reward GUI (/bountyadd). The reward slot is empty: admins place any item there.
bounty-gui:
  title: "<gradient:#d8b04a:#f1d58f:#ffd7ca>bounty | {player}</gradient>"
  rows: 3
  reward-slot: 13
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  items:
    head:
      slot: 4
      material: PLAYER_HEAD
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>{player}</gradient>"
      lore: ["<color:#a8a8a8>place the reward in the middle slot</color>"]
    timer:
      slot: 10
      material: CLOCK
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>survive time</gradient>"
      lore: ["<color:#a8a8a8>{minutes} minutes</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to +{step} minute</color>", "{mr_raw}  <color:#a8a8a8>RMB to -{step} minute</color>", "{ml_raw}  <color:#a8a8a8>SHIFT + LMB to +{step5} minutes</color>", "{mr_raw}  <color:#a8a8a8>SHIFT + RMB to -{step5} minutes</color>"]
    start:
      slot: 16
      material: GREEN_CONCRETE
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>start bounty</gradient>"
      lore: ["<color:#a8a8a8>survives: keeps the reward</color>", "<color:#a8a8a8>killed by a player: killer gets it</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to start</color>"]
    cancel:
      slot: 22
      material: RED_CONCRETE
      name: "<gradient:#d8b04a:#f1d58f:#ffd7ca>cancel</gradient>"
      lore: ["<color:#a8a8a8>the reward is returned to you</color>", "", "{ml_raw}  <color:#a8a8a8>LMB to close</color>"]
