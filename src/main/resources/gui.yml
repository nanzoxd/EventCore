# Ritual Creator GUI. Colours follow the Teams plugin theme (#F47F6A coral, #FAB2A0 soft).
# Names/lore support MiniMessage and {placeholders}. The admin menu (/eventcore gui) is built in code, theme in config.yml.
ritual-main:
  title: "<gradient:#F47F6A:#FAB2A0>ritual creator</gradient>"
  rows: 3
  items:
    cancel: {slot: 10, material: RED_CONCRETE, name: "<color:#FF2E4A>cancel rituals</color>", lore: ["<color:#FAB2A0>click to cancel the active ritual</color>"]}
    creation: {slot: 13, material: PLAYER_HEAD, name: "<color:#F47F6A>ritual creation</color>", lore: ["<color:#FAB2A0>click to pick the ritual item</color>"]}
    submit: {slot: 16, material: GREEN_CONCRETE, name: "<color:#2EFF2E>ritual submitter</color>", lore: ["<color:#FAB2A0>click to finish the ritual now</color>"]}
    time:
      slot: 4
      material: CLOCK
      name: "<color:#F47F6A>ritual time: <color:#FAB2A0>{minutes} minutes</color></color>"
      lore: ["<color:#FAB2A0>left click: <color:#2EFF2E>+1 minute</color></color>", "<color:#FAB2A0>right click: <color:#FF2E4A>-1 minute</color></color>"]
ritual-select:
  title: "<gradient:#F47F6A:#FAB2A0>please select an item</gradient>"
  rows: 3
  input-slot: 13
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
