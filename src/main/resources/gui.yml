# Ritual Creator + bounty GUIs. Theme: names #A5B8FF, hints #AAAAAA, cooldown notes #7F7F7F.
# Layout of every item: name (gold to peach gradient) | short description (gray) | blank line | mouse hints.
# Names/lore support MiniMessage and {placeholders}; mouse icons are {ml_raw} {mr_raw}. The admin menu (/eventcore gui) is built in code, colours in config.yml theme.
# Layout matches RitualCreator.sk: stop 10 | timer 12 | creator 13 | particle colours 14 | end 16
ritual-main:
  title: "<gradient:#9babc7:#E7E7E7:#E7E7E7>ritual creator</gradient>"
  rows: 3
  items:
    cancel:
      slot: 10
      material: RED_CONCRETE
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>stop ritual</gradient>"
      lore: ["<#AAAAAA>ends the active ritual", "<#7F7F7F>no completion reward", "", "{ml_raw}  <#AAAAAA>LMB to stop"]
    time:
      slot: 12
      material: CLOCK
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>ritual timer</gradient>"
      lore: ["<#AAAAAA>{minutes} minutes", "", "{ml_raw}  <#AAAAAA>LMB to +1 minute", "{mr_raw}  <#AAAAAA>RMB to -1 minute"]
    creation:
      slot: 13
      material: BEACON
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>ritual creator</gradient>"
      lore: ["<#AAAAAA>place an item to create a ritual", "", "{ml_raw}  <#AAAAAA>LMB to open the item selector"]
    palette:
      slot: 14
      material: NETHER_STAR
      name: "<color:{palette_color_raw}>{palette_label}</color>"
      lore: ["{ml_raw}  <#AAAAAA>LMB to cycle particle colors"]
    submit:
      slot: 16
      material: GREEN_CONCRETE
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>end ritual</gradient>"
      lore: ["<#AAAAAA>completes the active ritual", "", "{ml_raw}  <#AAAAAA>LMB to complete now"]
ritual-select:
  title: "<gradient:#9babc7:#E7E7E7:#E7E7E7>select an item</gradient>"
  rows: 3
  input-slot: 13
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
# Bounty reward GUI (/bountyadd). The reward slot is empty: admins place any item there.
bounty-gui:
  title: "<gradient:#9babc7:#E7E7E7:#E7E7E7>bounty | {player}</gradient>"
  rows: 3
  reward-slot: 13
  filler: {material: BLACK_STAINED_GLASS_PANE, name: " "}
  items:
    head:
      slot: 4
      material: PLAYER_HEAD
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>{player}</gradient>"
      lore: ["<#AAAAAA>place the reward in the middle slot"]
    timer:
      slot: 10
      material: CLOCK
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>survive time</gradient>"
      lore: ["<#AAAAAA>{minutes} minutes", "", "{ml_raw}  <#AAAAAA>LMB to +{step} minute", "{mr_raw}  <#AAAAAA>RMB to -{step} minute", "{ml_raw}  <#AAAAAA>SHIFT + LMB to +{step5} minutes", "{mr_raw}  <#AAAAAA>SHIFT + RMB to -{step5} minutes"]
    start:
      slot: 16
      material: GREEN_CONCRETE
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>start bounty</gradient>"
      lore: ["<#AAAAAA>survives: keeps the reward", "<#AAAAAA>killed by a player: killer gets it", "", "{ml_raw}  <#AAAAAA>LMB to start"]
    cancel:
      slot: 22
      material: RED_CONCRETE
      name: "<gradient:#9babc7:#E7E7E7:#E7E7E7>cancel</gradient>"
      lore: ["<#AAAAAA>the reward is returned to you", "", "{ml_raw}  <#AAAAAA>LMB to close"]
