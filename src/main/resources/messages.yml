# Messages. Text supports MiniMessage, <g> (palette gradient) and {placeholders}.
# A message may be a plain string or a section {text, sound: {sound, volume, pitch}}.
prefix: "<gradient:#808080:#C4C4C4:#808080>eventcore |</gradient> "
ritual-prefix: "<g>ritual</g> <dark_gray>|</dark_gray> "
errors:
  no-permission: "<red>you do not have permission.</red>"
  player-only: "<red>this command can only be used by a player.</red>"
  unknown-event: "<red>unknown event:</red> <gray>{input}</gray>"
  unknown-tier: "<red>unknown crate tier:</red> <gray>{input}</gray>"
  disabled: "<red>{event} is disabled.</red>"
  already-running: "<red>that event is already running.</red>"
  not-running: "<red>{event} is not running.</red>"
  cooldown: "<red>{event} is on cooldown.</red>"
  max-concurrent: "<red>too many events are running at once.</red>"
  incompatible: "<red>that event cannot run together with a running event.</red>"
  invalid-number: "<red>invalid number:</red> <gray>{input}</gray>"
  nothing-to-start: "<red>no event could be started.</red>"
command:
  usage: "<g>/eventcore (opens the menu) [start|force|rig|stop|list|reload|gui|schedule|airdrop]</g>"
  started: "<g>started {event}.</g>"
  force-started: "<g>force-started {event}.</g>"
  rolled: "<g>started: {events}</g>"
  rigged: "<g>{event} will be picked by the next random roll.</g>"
  rig-list: "<g>rigged: {events}</g>"
  rig-cleared: "<g>rigs cleared.</g>"
  stopped: "<g>stopped {event}.</g>"
  stopped-all: "<g>stopped {count} event(s).</g>"
  nothing-running: "<red>no event is running.</red>"
  reloaded: "<g>configuration reloaded.</g>"
  list-header: "<g>events:</g>"
  list-line: "<white>{event}</white> <gray>{state} | {minutes}m</gray>"
  schedule-header: "<g>next scheduled starts ({zone}):</g>"
  schedule-line: "<white>{event}</white> <gray>{at} (in {in})</gray>"
  schedule-none: "<gray>nothing is scheduled.</gray>"
  airdrop-spawned: "<g>dropping a {tier} crate.</g>"
  airdrop-cancelled: "<g>cancelled {count} falling lootdrop(s).</g>"
  airdrop-nothing-falling: "<red>no lootdrop is falling right now.</red>"
event-join:      # sent once to players who join while an event is running (rules come from events.<id>.messages.join)
  header: "<g>{event} is running ({time} left)</g>"
  bullet: "<g>-</g> "
scheduler:
  warning: "<g>{event} starts in {time}!</g>"
events:
  shield-blocked: "<red>shields are disabled right now.</red>"
  invisibility-blocked: "<red>invisibility is disabled right now.</red>"
  command-blocked: "<red>{command} is blocked during this event.</red>"
random-target:
  # {targethead} = the target's head (needs Paper 1.21.9+ and a 1.21.9+ client, otherwise a symbol), {player}, {distance}
  actionbar: "<g>target</g> {targethead} {player} <g>:</g> {distance}"
  no-target: "<g>target</g> <gray>waiting for another player</gray>"
  offline: "offline"
  other-world: "other dimension"
  winner-title: {title: "<g>{player} is top killer</g> 🏆", subtitle: "<g>{kills} kills</g>"}
  no-winner-title: {title: "<g>nobody got a kill</g>", subtitle: ""}
gui:
  invalid: "<red>invalid value:</red> <gray>{reason}</gray>"
  prompt-edit: "<g>type a new value for {path} in chat</g> <gray>(current: {value}, type cancel to abort)</gray>"
  prompt-add: "<g>type an entry to add to {path} in chat</g> <gray>(type cancel to abort)</gray>"
  prompt-simple: "<g>type the {what} in chat</g> <gray>(type cancel to abort)</gray>"
  loot-saved: "<g>loot pool saved.</g>"
  loot-need-item: "<red>click this slot while holding an item on your cursor.</red>"
ritual:
  no-active: "<red>there are no active rituals</red>"
  wait-active: "<red>please wait for the current active ritual to end</red>"
  broadcast: "<gray>a</gray> <g>ritual</g> <gray>was initiated by</gray> <green>{player}</green><gray>. location: {world} [{x}, {y}, {z}]</gray>"
  start-title: {title: "<g>{item} ritual started</g>", subtitle: "<g>defend the piece while it charges!</g>"}
  announce-title: {title: "<g>{item} ritual started</g>", subtitle: "<g>{world} | {x}, {y}, {z}</g>"}
  complete-title: {title: "<g>{item} ritual completed</g>", subtitle: ""}
  stopped-title: {title: "<g>ritual stopped</g>", subtitle: ""}
  stopped-broadcast: "<red>all rituals ended</red>"
  bossbar-title: "<bb>✦ {item} Ritual | {time} [{x}, {y}, {z}]</bb>"
  name-text: "{item_display}"
  unnamed-format: "<gold>{item}</gold>"
  timer-text: "<red>({time} left)</red>"
  reload-warning: "<red>warning: reloading while a ritual is active may cause issues (the ritual keeps running)</red>"
hunt:
  usage: "<g>/playerhunt [player ...] | stop [player|all] | list</g>"
  disabled: "<red>player hunt is disabled.</red>"
  started: "<g>⌖ hunt started on {players}</g>"
  nothing-added: "<red>nobody was added (offline, already hunted or limit {max} reached).</red>"
  not-online: "<red>{input} is not online.</red>"
  not-hunted: "<red>{input} is not being hunted.</red>"
  stopped: "<g>stopped hunting {player}.</g>"
  stopped-all: "<g>hunt ended ({count} targets).</g>"
  nothing: "<red>nobody is being hunted.</red>"
  target-died: "<g>⌖ {player} died, the hunt on them ended.</g>"
  list-header: "<g>hunted players ({count}):</g>"
  list-line: "<white>{player}</white> <gray>{world} [{x}, {y}, {z}]</gray>"
  list-line-offline: "<white>{player}</white> <gray>offline</gray>"
  bossbar-locating: "<bb>⌖ hunt | {player}</bb>"
  bossbar: "<bb>⌖ hunt | {player} | {world} [{x}, {y}, {z}]</bb>"
  bossbar-offline: "<bb>⌖ hunt | {player} | offline</bb>"
  broadcast-header: "<g>⌖ hunt update</g>"
  broadcast-line: "<g>›</g> <white>{player}</white> <gray>{world} [{x}, {y}, {z}]</gray>"
  broadcast-offline: "<g>›</g> <white>{player}</white> <gray>offline</gray>"
  target-title: {title: "<g>you are being hunted</g>", subtitle: "<g>everyone can see your coordinates</g>"}
bounty:
  usage: "<g>/bountyadd [player]</g>"
  nothing: "<red>there are no bounties.</red>"
  not-found: "<red>no bounty on {input}.</red>"
  stopped: "<g>bounty on {player} cancelled, reward returned to its creator.</g>"
  stopped-all: "<g>{count} bounty(ies) cancelled, rewards returned.</g>"
  error-disabled: "<red>bounties are disabled.</red>"
  error-need-reward: "<red>put a reward item in the reward slot first.</red>"
  error-not-online: "<red>{input} is not online.</red>"
  error-already: "<red>{player} already has a bounty.</red>"
  error-limit: "<red>too many active bounties (max {max}).</red>"
  started: "<g>⚔ bounty on {player}! reward: {reward}. survive {minutes} minutes or get killed.</g>"
  coords: "<g>⚔ bounty</g> <white>{player}</white> <gray>{world} [{x}, {y}, {z}] | {time} left | {reward}</gray>"
  bossbar: "<bb>⚔ Bounty | {player} | {reward} | {world} [{x}, {y}, {z}] | {time}</bb>"
  bossbar-offline: "<bb>⚔ Bounty | {player} | offline, back in {grace} or it moves | {time}</bb>"
  target-left: "<g>⚔ {player} left. back within {grace} or the bounty moves to someone else.</g>"
  target-back: "<g>⚔ {player} is back. the bounty continues.</g>"
  transferred: "<g>⚔ the bounty moved to {player}. reward: {reward}</g>"
  no-candidate: "<g>⚔ no eligible player for the bounty. it ended and the reward went back to {creator}.</g>"
  survived: "<g>⚔ {player} survived the bounty and wins {reward}!</g>"
  claimed: "<g>⚔ {killer} killed {player} and claims {reward}!</g>"
  cancelled: "<g>⚔ the bounty on {player} was cancelled.</g>"
  cancelled-offline: "<g>⚔ the bounty on {player} ended: they stayed offline.</g>"
  cancelled-death: "<g>⚔ {player} died and the bounty ended.</g>"
  reward-received: "<g>you received your bounty reward.</g>"
  reward-dropped: "<g>your inventory was full: the reward was dropped at your feet, only you can pick it up.</g>"
  list-header: "<g>active bounties ({count}):</g>"
  list-line: "<white>{player}</white> <gray>{reward} | {time} | {state} | by {creator}</gray>"
  titles:
    survived: {title: "<g>victory</g>", subtitle: "<g>you survived the bounty: {reward}</g>"}
    claimed: {title: "<g>victory</g>", subtitle: "<g>you claimed the bounty: {reward}</g>"}
    killed: {title: "<g>defeat</g>", subtitle: "<g>{killer} claimed your bounty</g>"}
    target-start: {title: "<g>bounty on you</g>", subtitle: "<g>survive {minutes} minutes</g>"}
    new-target: {title: "<g>bounty on you</g>", subtitle: "<g>the bounty moved to you: {reward}</g>"}
ritual-schedule:
  usage: "<g>/ritual schedule | list | cancel [id]</g>"
  need-item: "<red>place the ritual item in the middle slot.</red>"
  need-location: "<red>set the location first.</red>"
  in-the-past: "<red>that time has already passed in {zone}.</red>"
  scheduled: "<g>ritual scheduled (id {id}): {when} at {world} [{x}, {y}, {z}], {item}, {minutes} min.</g>"
  nothing: "<red>no scheduled rituals.</red>"
  list-header: "<g>scheduled rituals ({count}):</g>"
  list-line: "<white>{id}</white> <gray>{when} | {world} [{x}, {y}, {z}] | {item} | {minutes} min | by {creator}</gray>"
  not-found: "<red>no scheduled ritual with id {input}.</red>"
  cancelled: "<g>schedule {id} cancelled, the item is back in your inventory.</g>"
  player-only-cancel: "<red>cancel as a player so the item can be returned.</red>"

egg-hunt:
  usage: "<g>/egghunt [start|stop|reset|leaderboard|reload|setarea|addspawn|clearspawns]</g>"
  cleaning: "<red>the previous egg hunt is still being cleaned up, try again in a moment.</red>"
  no-world: "<red>the egg hunt area world does not exist.</red>"
  reset: "<g>egg hunt reset, every egg removed.</g>"
  hidden: "<g>◈ {total} eggs are hidden, you have {minutes} minutes.</g>"
  actionbar: "<g>◈ eggs</g> <white>{eggs}</white><gray> / {total}</gray>"
  already: "<gray>you already collected this egg.</gray>"
  collected: "<g>◈ {rarity} egg collected ({eggs}/{total})</g>"
  first-find: "<g>◈ {player} found the first egg!</g>"
  milestone: "<g>◈ {player} has collected {eggs} eggs!</g>"
  found-all: "<g>◈ {player} found every single egg!</g>"
  time-warning: "<g>◈ egg hunt ends in {time}</g>"
  cancelled: "<g>the egg hunt was cancelled, no rewards were given.</g>"
  board-header: "<g>◈ egg hunt standings:</g>"
  board-header-last: "<g>◈ last egg hunt results:</g>"
  end-header: "<g>◈ egg hunt over, final standings:</g>"
  board-line: "<g>{rank}.</g> <white>{player}</white> <gray>{eggs} eggs</gray>"
  board-empty: "<gray>nobody has collected an egg yet.</gray>"
  end-none: "<g>the egg hunt is over, nobody found an egg.</g>"
  area-set: "<g>egg hunt area set: {world} [{x}, {z}] radius {radius}.</g>"
  spawn-added: "<g>fixed egg spawn added at [{x}, {y}, {z}] ({count} total).</g>"
  spawns-cleared: "<g>fixed egg spawns cleared.</g>"
disaster:
  usage: "<g>/disaster [start|stop|reset|setcenter|setarena|setexit|status|reload|join|leave]</g>"
  not-configured: "<red>set the arena centre first with /disaster setcenter.</red>"
  not-enough-players: "<red>natural disaster cancelled: {count} eligible player(s), at least {min} needed.</red>"
  setcenter: "<g>border centre set to {world} [{x}, {z}].</g>"
  setarena: "<g>arena spawn set to [{x}, {y}, {z}].</g>"
  setexit: "<g>exit destination set to {world} [{x}, {y}, {z}].</g>"
  reset: "<g>natural disaster reset, every player cleaned up.</g>"
  status-running: "<g>natural disaster running:</g> <white>{time}</white> <gray>left | {alive}/{total} alive | border {radius} | next shrink {next}</gray>"
  status-idle: "<g>natural disaster idle.</g> <gray>{signups} sign-up(s)</gray>"
  joined: "<g>you are signed up for the next natural disaster.</g>"
  already-joined: "<gray>you are already signed up.</gray>"
  left: "<g>you are no longer signed up.</g>"
  not-joined: "<gray>you were not signed up.</gray>"
  join-running: "<red>the natural disaster is already running.</red>"
  join-not-needed: "<gray>sign-up is not needed, everyone takes part.</gray>"
  briefing: "<g>⚡ last player standing: the {size}x{size} arena border shrinks over time, stay inside it. Commands are disabled except warps.</g>"
  actionbar: "<g>⚡ border</g> <white>{radius}</white><gray> | next {next} | {alive} alive | {time}</gray>"
  warning: "<g>⚡ the border starts shrinking to {radius} blocks in {time}!</g>"
  shrinking: "<g>⚡ the border is shrinking to {radius} blocks over {seconds} seconds!</g>"
  outside: "<red>⚡ get back inside the border! {seconds}s left</red>"
  grace: "<gray>pvp is off for the first moments.</gray>"
  cannot-leave: "<red>you cannot leave the arena during the event.</red>"
  arena-closed: "<red>the arena is closed while the natural disaster runs.</red>"
  command-blocked: "<red>{command} is blocked during the natural disaster.</red>"
  you-eliminated: "<red>⚡ you were eliminated.</red>"
  eliminated-death: "<g>⚡ {player} was eliminated, {alive} left.</g>"
  eliminated-killed: "<g>⚡ {player} was eliminated by {killer}, {alive} left.</g>"
  eliminated-border: "<g>⚡ {player} was eliminated by the border, {alive} left.</g>"
  eliminated-disconnect: "<g>⚡ {player} disconnected, {alive} left.</g>"
  eliminated-left: "<g>⚡ {player} left the arena, {alive} left.</g>"
  eliminated-title: {title: "<g>eliminated</g>", subtitle: "<g>{alive} players left</g>"}
  winner: "<g>⚡ {player} is the last player standing and wins the natural disaster!</g>"
  winner-timeup: "<g>⚡ time is up! {player} wins the natural disaster.</g>"
  draw: "<g>⚡ time is up! {player} share the win.</g>"
  winner-title: {title: "<g>{player}</g>", subtitle: "<g>won the natural disaster</g>"}
  no-winner: "<g>⚡ the natural disaster ended without a winner.</g>"
  cancelled: "<g>the natural disaster was cancelled.</g>"
  hazard-wind-charge: "<g>⚡ a giant wind charge is falling, watch the ring and get clear!</g>"
  hazard-meteor: "<g>⚡ a meteor is falling, get out of the ring!</g>"
  hazard-lava: "<g>⚡ the ground rumbles, a lava geyser is about to erupt!</g>"
  hazard-water: "<g>⚡ the ground rumbles, a water geyser is about to erupt!</g>"
  hazard-windstorm: "<g>⚡ a wind storm is blowing, hold your ground!</g>"
  hazard-tornado: "<g>⚡ a tornado has formed, it is coming for you!</g>"
  hazard-hurricane: "<g>⚡ a hurricane is hitting the arena, brace yourself!</g>"
  hazard-earthquake: "<g>⚡ the ground is shaking, an earthquake is about to split the earth open!</g>"
  hazard-laser: "<g>⚡ a red laser has locked on, get away from the ring before the ground collapses!</g>"
  hazard-thunderstorm: "<g>⚡ a thunderstorm is rolling in, lightning is hunting you, keep moving!</g>"
  hazard-meteor-shower: "<g>⚡ the sky darkens, a meteor shower is incoming!</g>"
