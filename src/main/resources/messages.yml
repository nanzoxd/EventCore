# Messages. MiniMessage hex tags + <g> (= info colour #A5B8FF from config.yml palette) + {placeholders}.
# Theme: info #A5B8FF | body #FFFFFF | brackets #555555 | muted #AAAAAA | success #00FF55 | error #EE2424
#        warning/timers #FF5555 | event #E3948F | highlight #FFD54A | staff #FFA100 | cooldown #7F7F7F
#        top-of-screen: "Label: " #FF5555, value #FFFFFF, details #AAAAAA
# A message may be a plain string or a section {text, sound: {sound, volume, pitch}}.
prefix: "<gradient:#808080:#C4C4C4:#808080>eventcore |</gradient> <#FFFFFF>"
ritual-prefix: "<gradient:#808080:#C4C4C4:#808080>ritual |</gradient> <#FFFFFF>"
errors:
  no-permission: "<#EE2424>you do not have permission.</#EE2424>"
  player-only: "<#EE2424>this command can only be used by a player.</#EE2424>"
  unknown-event: "<#EE2424>unknown event:</#EE2424> <#AAAAAA>{input}</#AAAAAA>"
  unknown-tier: "<#EE2424>unknown crate tier:</#EE2424> <#AAAAAA>{input}</#AAAAAA>"
  disabled: "<#EE2424>{event} is disabled.</#EE2424>"
  already-running: "<#EE2424>that event is already running.</#EE2424>"
  not-running: "<#EE2424>{event} is not running.</#EE2424>"
  cooldown: "<#EE2424>{event} is on cooldown.</#EE2424>"
  max-concurrent: "<#EE2424>too many events are running at once.</#EE2424>"
  incompatible: "<#EE2424>that event cannot run together with a running event.</#EE2424>"
  invalid-number: "<#EE2424>invalid number:</#EE2424> <#AAAAAA>{input}</#AAAAAA>"
  nothing-to-start: "<#EE2424>no event could be started.</#EE2424>"
command:
  usage: "<#A5B8FF>Usage: /eventcore (opens the menu) [start|force|rig|stop|list|reload|gui|schedule|airdrop]</#A5B8FF>"
  started: "<#00FF55>started {event}."
  force-started: "<#00FF55>force-started {event}."
  rolled: "<#00FF55>started: {events}"
  rigged: "<#00FF55>{event} will be picked by the next random roll."
  rig-list: "<g>rigged: {events}</g>"
  rig-cleared: "<#00FF55>rigs cleared."
  stopped: "<#00FF55>stopped {event}."
  stopped-all: "<#00FF55>stopped {count} event(s)."
  nothing-running: "<#EE2424>no event is running.</#EE2424>"
  reloaded: "<#00FF55>configuration reloaded."
  list-header: "<g>events:</g>"
  list-line: "<#FFFFFF>{event}</#FFFFFF> <#AAAAAA>{state} | {minutes}m</#AAAAAA>"
  schedule-header: "<g>next scheduled starts ({zone}):</g>"
  schedule-line: "<#FFFFFF>{event}</#FFFFFF> <#AAAAAA>{at} (in {in})</#AAAAAA>"
  schedule-none: "<#AAAAAA>nothing is scheduled.</#AAAAAA>"
  airdrop-spawned: "<#00FF55>dropping a {tier} crate."
  airdrop-cancelled: "<#00FF55>cancelled {count} falling lootdrop(s)."
  airdrop-nothing-falling: "<#EE2424>no lootdrop is falling right now.</#EE2424>"
event-join:      # sent once to players who join while an event is running (rules come from events.<id>.messages.join)
  header: "<g>{event} is running ({time} left)</g>"
  bullet: "<g>-</g> "
scheduler:
  warning: "<g>{event} starts in {time}!</g>"
events:
  shield-blocked: "<#EE2424>shields are disabled right now.</#EE2424>"
  invisibility-blocked: "<#EE2424>invisibility is disabled right now.</#EE2424>"
  command-blocked: "<#EE2424>{command} is blocked during this event.</#EE2424>"
random-target:
  # {targethead} = the target's head (needs Paper 1.21.9+ and a 1.21.9+ client, otherwise a symbol), {player}, {distance}
  actionbar: "<#FF5555>Target: <#FFFFFF>{targethead} {player} <#AAAAAA>{distance}"
  no-target: "<#FF5555>Target: <#AAAAAA>waiting for another player"
  offline: "offline"
  other-world: "other dimension"
