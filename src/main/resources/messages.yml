gui:
  invalid: "<#EE2424>invalid value:</#EE2424> <#AAAAAA>{reason}</#AAAAAA>"
  prompt-edit: "<g>type a new value for {path} in chat</g> <#AAAAAA>(current: {value}, type cancel to abort)</#AAAAAA>"
