name: EventCore
version: '${project.version}'
main: com.eventcore.EventCorePlugin
api-version: '1.21'
folia-supported: true
softdepend: [SkinsRestorer]
description: Scheduled server events, the Ritual Creator and airdrop crates, altars, player hunts and bounties.
authors: [EventCore]

commands:
  eventcore:
    description: EventCore admin command
    usage: /<command> <start|force|rig|stop|list|reload|gui|schedule|airdrop>
    aliases: [ec]
  ritual:
    description: Ritual menu - /ritual schedule opens the ritual scheduler
    usage: /<command> [schedule | list | cancel <id>]
    permission: eventcore.ritual
  ritualcreator:
    description: Open the Ritual Creator
    usage: /<command>
    aliases: [rcreator, creator]
    permission: eventcore.ritual
    permission-message: You do not have permission.

  altar:
    description: Custom crafting altars (spawn presets, recipes)
    usage: /<command> <spawn|remove|list|recipes|bind|stop|reload>
    aliases: [altars]
    permission: eventcore.altar

  playerhunt:
    description: Hunt players - live coordinates in a bossbar and in chat
    usage: /<command> [player ...] | stop [player|all] | list
    aliases: [phunt]
    permission: eventcore.playerhunt
  bountyadd:
    description: Place a bounty on a player (opens the reward GUI)
    usage: /<command> <player>
    aliases: [bounty]
    permission: eventcore.bounty
  bountystop:
    description: Cancel a bounty (reward goes back to its creator)
    usage: /<command> [player|all]
    permission: eventcore.bounty
  bountylist:
    description: List active bounties
    usage: /<command>
    permission: eventcore.bounty
  egghunt:
    description: Egg Hunt event
    usage: /<command> <start|stop|reset|leaderboard|reload|setarea|addspawn|clearspawns>
    aliases: [eh]
  disaster:
    description: Natural Disaster event
    usage: /<command> <start|stop|reset|setcenter|setarena|setexit|status|reload|join|leave>
    aliases: [nd]

permissions:
  eventcore.egghunt.admin:
    description: All Egg Hunt admin commands
    default: op
    children:
      eventcore.egghunt.start: true
      eventcore.egghunt.stop: true
      eventcore.egghunt.reset: true
      eventcore.egghunt.reload: true
      eventcore.egghunt.setarea: true
      eventcore.egghunt.addspawn: true
      eventcore.egghunt.clearspawns: true
  eventcore.egghunt.start: {default: op}
  eventcore.egghunt.stop: {default: op}
  eventcore.egghunt.reset: {default: op}
  eventcore.egghunt.reload: {default: op}
  eventcore.egghunt.setarea: {default: op}
  eventcore.egghunt.addspawn: {default: op}
  eventcore.egghunt.clearspawns: {default: op}
  eventcore.egghunt.leaderboard: {default: true}
  eventcore.disaster.admin:
    description: All Natural Disaster admin commands
    default: op
    children:
      eventcore.disaster.start: true
      eventcore.disaster.stop: true
      eventcore.disaster.reset: true
      eventcore.disaster.reload: true
      eventcore.disaster.setcenter: true
      eventcore.disaster.setarena: true
      eventcore.disaster.setexit: true
  eventcore.disaster.start: {default: op}
  eventcore.disaster.stop: {default: op}
  eventcore.disaster.reset: {default: op}
  eventcore.disaster.reload: {default: op}
  eventcore.disaster.setcenter: {default: op}
  eventcore.disaster.setarena: {default: op}
  eventcore.disaster.setexit: {default: op}
  eventcore.disaster.status: {default: true}
  eventcore.disaster.join: {default: true}
  eventcore.disaster.leave: {default: true}
  eventcore.disaster.exempt:
    description: Never drafted into the Natural Disaster
    default: false
  eventcore.admin:
    description: All EventCore admin commands
    default: op
    children:
      eventcore.start: true
      eventcore.force: true
      eventcore.rig: true
      eventcore.stop: true
      eventcore.list: true
      eventcore.reload: true
      eventcore.gui: true
      eventcore.schedule: true
      eventcore.airdrop: true
      eventcore.ritual: true
      eventcore.altar: true
      eventcore.playerhunt: true
      eventcore.bounty: true
      eventcore.egghunt.admin: true
      eventcore.disaster.admin: true
  eventcore.start: {default: op}
  eventcore.force: {default: op}
  eventcore.rig: {default: op}
  eventcore.stop: {default: op}
  eventcore.list: {default: op}
  eventcore.reload: {default: op}
  eventcore.gui: {default: op}
  eventcore.schedule: {default: op}
  eventcore.airdrop: {default: op}
  eventcore.ritual:
    description: Use the Ritual Creator
    default: op
  eventcore.bypass:
    description: Bypass event restrictions (blocked commands, anonymous reveal)
    default: op
  eventcore.altar:
    description: Manage altars and altar recipes
    default: op
  eventcore.altar.use:
    description: Craft at an altar
    default: true
  eventcore.playerhunt:
    description: Start, stop and list player hunts
    default: op
  eventcore.bounty:
    description: Place, cancel and list bounties
    default: op
  eventcore.bounty.exempt:
    description: Never chosen as the new target when a bounty is transferred
    default: false
