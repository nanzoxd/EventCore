# Quest Event quests. Edit here or in /quest admin -> Manage quests. /quest reload applies changes.
# type: KILL_PLAYER KILL_ENTITY DAMAGE_PLAYER WIN_PVP MINE_BLOCK SMELT COLLECT CRAFT TRAVEL EXPLODE_TNT OPEN_CHEST BREED FISH TRADE PLACE_BLOCK BREAK_BLOCK
# every quest is worth exactly 1 point.
# targets: Material / EntityType names, empty = anything.  requires: id of a quest that must be completed first (locked until then).
settings:
  auto-start: true        # unlocked quests become active on their own (players can still abandon / start them in the GUI)
  allow-abandon: true     # right-click an active quest to abandon it (progress is reset)
  ignore-creative: true   # creative / spectator players do not make progress
  max-active: 12          # most quests that can be active at once

categories:
  combat: {name: "Combat", icon: IRON_SWORD}
  mining: {name: "Mining", icon: DIAMOND_PICKAXE}
  survival: {name: "Survival", icon: BREAD}
  exploration: {name: "Exploration & Misc", icon: COMPASS}

quests:
  # ---------------- combat ----------------
  kill_player_1: {category: combat, title: "First Blood", description: "Take down your first opponent.", icon: IRON_SWORD, type: KILL_PLAYER, amount: 1}
  kill_player_5: {category: combat, title: "Player Hunter", description: "Hunt down five opponents.", icon: DIAMOND_SWORD, type: KILL_PLAYER, amount: 5, requires: kill_player_1}
  kill_player_10: {category: combat, title: "Executioner", description: "Ten players have fallen to you.", icon: NETHERITE_SWORD, type: KILL_PLAYER, amount: 10, requires: kill_player_5}
  kill_zombie_3: {category: combat, title: "Zombie Slayer", description: "Clear out a few zombies.", icon: ROTTEN_FLESH, type: KILL_ENTITY, targets: [ZOMBIE], amount: 3}
  kill_skeleton_10: {category: combat, title: "Bone Collector", description: "Rattle some skeletons.", icon: BONE, type: KILL_ENTITY, targets: [SKELETON], amount: 10}
  kill_creeper_5: {category: combat, title: "Quiet Defuser", description: "Take out creepers before they blow.", icon: GUNPOWDER, type: KILL_ENTITY, targets: [CREEPER], amount: 5}
  kill_enderman_3: {category: combat, title: "Don't Look Away", description: "Defeat endermen.", icon: ENDER_EYE, type: KILL_ENTITY, targets: [ENDERMAN], amount: 3}
  damage_500: {category: combat, title: "Heavy Hitter", description: "Deal a lot of damage to other players.", icon: BLAZE_POWDER, type: DAMAGE_PLAYER, amount: 500}
  pvp_win_3: {category: combat, title: "Duelist", description: "Win fights against players who hit you back.", icon: SHIELD, type: WIN_PVP, amount: 3}
