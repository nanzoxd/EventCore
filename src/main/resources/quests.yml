  mine_iron_32: {category: mining, title: "Iron Will", description: "Mine iron ore.", icon: RAW_IRON, type: MINE_BLOCK, targets: [IRON_ORE, DEEPSLATE_IRON_ORE], amount: 32, requires: mine_stone_64}
