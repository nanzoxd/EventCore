        outer: {shape: circle, particle: DUST, color: "#3b6cff", size: 0.9, radius: 9.0, count: 120, particles-min: 1, particles-max: 1}
        tri1: {shape: polygon, sides: 3, rotation: 0.0, particle: DUST, color: "#3b6cff", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        tri2: {shape: polygon, sides: 3, rotation: 60.0, particle: DUST, color: "#3b6cff", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        falling: {shape: rain, particle: RAIN, radius: 9.0, count: 6, y-min: 3.0, y-max: 6.0, height: 0.0, particles-min: 1, particles-max: 1}
    red:
