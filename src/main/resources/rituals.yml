# Ritual Creator. Values mirror RitualCreator.sk (sigil circle, palettes, timer in the bossbar).
time:
  minutes: 15      # current value (changed by the clock in the GUI)
  min: 1
  max: 60
rotation:
  enabled: true
  degrees-per-tick: 3.0
  interval-ticks: 1
entities:
  text-mode: ARMOR_STAND   # ARMOR_STAND or TEXT_DISPLAY
  display:
    height: 1.5
    glowing: true
    transform: NONE        # ItemDisplay transform: NONE, GROUND, FIXED, GUI, HEAD ...
    scale: 1.0
    glow-color: ""         # optional hex outline colour
  item-name:
    height: 2.275
  timer:
    height: 2.0
sounds:
  start: {sound: "block.end_portal.spawn", volume: 1.0, pitch: 1.0}
  complete: {sound: "entity.ender_dragon.death", volume: 1.0, pitch: 2.0}
  stop: {sound: "entity.ender_dragon.death", volume: 0.75, pitch: 3.0}
bossbar:
  enabled: true
  color: YELLOW            # fallback; the active particle palette (particles.palettes.<name>.bossbar-color) decides
  style: PROGRESS
  progress-mode: COUNTDOWN # COUNTDOWN (like RitualCreator.sk: drains to 0) or STATIC
  static-progress: 1.0
cancel:
  return-item-to-admin: false
persistence:
  enabled: true
  on-restart: RESTORE      # RESTORE or CANCEL
  cancel-drops-item: true  # with CANCEL: drop the item at the ritual spot
  save-interval-seconds: 10
# The ritual circle from RitualCreator.sk: a static sigil (one circle with a hexagram of two overlapping
# triangles in the middle) plus ambient particles falling above it. Default palettes: gold and peach, plus the fire / pink / blue / red / white presets of the Skript.
# The sigil redraws every interval-ticks (raise it first if the server lags) and is only drawn while a player is
# within view-distance. height is measured from the ritual spot; 2.325 = the item-name stand (2.275) + 0.05, like the original.
particles:
  enabled: true
  interval-ticks: 4
  view-distance: 32
  height: 2.325
  palette: gold               # current palette (changed by the nether star in the GUI)
  cycle: [gold, peach, fire, pink, blue, red, white]   # order the nether star cycles through
  palettes:
    gold:
      label: "gold"
      color: "#d8b04a"        # name colour of the GUI button
      bossbar-color: YELLOW   # vanilla bossbar colour used while this palette is active
      layers:
        outer: {shape: circle, particle: DUST, color: "#d8b04a", size: 0.9, radius: 9.0, count: 120, particles-min: 1, particles-max: 1}
        tri1: {shape: polygon, sides: 3, rotation: 0.0, particle: DUST, color: "#e8c670", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        tri2: {shape: polygon, sides: 3, rotation: 60.0, particle: DUST, color: "#f1d58f", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        falling: {shape: rain, particle: WAX_ON, radius: 9.0, count: 6, y-min: 3.0, y-max: 6.0, height: 0.0, particles-min: 1, particles-max: 1}
    peach:
      label: "peach"
      color: "#ffcfca"
      bossbar-color: PINK
      layers:
        outer: {shape: circle, particle: DUST, color: "#ffcfca", size: 0.9, radius: 9.0, count: 120, particles-min: 1, particles-max: 1}
        tri1: {shape: polygon, sides: 3, rotation: 0.0, particle: DUST, color: "#ffd7ca", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        tri2: {shape: polygon, sides: 3, rotation: 60.0, particle: DUST, color: "#ffe4d5", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        falling: {shape: rain, particle: CHERRY_LEAVES, radius: 9.0, count: 6, y-min: 3.0, y-max: 6.0, height: 0.0, particles-min: 1, particles-max: 1}
    # ---- presets from RitualCreator.sk (fire / pink / blue / red / white) ----
    fire:
      label: "fire"
      color: "#ff8a1f"
      bossbar-color: YELLOW
      layers:
        outer: {shape: circle, particle: FLAME, size: 0.9, radius: 9.0, count: 120, particles-min: 1, particles-max: 1}
        tri1: {shape: polygon, sides: 3, rotation: 0.0, particle: DRIPPING_LAVA, size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        tri2: {shape: polygon, sides: 3, rotation: 60.0, particle: FLAME, size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        falling: {shape: rain, particle: WAX_ON, radius: 9.0, count: 6, y-min: 3.0, y-max: 6.0, height: 0.0, particles-min: 1, particles-max: 1}
    pink:
      label: "pink"
      color: "#ff69b4"
      bossbar-color: PINK
      layers:
        outer: {shape: circle, particle: DUST, color: "#ff69b4", size: 0.9, radius: 9.0, count: 120, particles-min: 1, particles-max: 1}
        tri1: {shape: polygon, sides: 3, rotation: 0.0, particle: DUST, color: "#ff69b4", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        tri2: {shape: polygon, sides: 3, rotation: 60.0, particle: DUST, color: "#ff69b4", size: 0.9, radius: 4.5, count: 24, particles-min: 1, particles-max: 1}
        falling: {shape: rain, particle: CHERRY_LEAVES, radius: 9.0, count: 6, y-min: 3.0, y-max: 6.0, height: 0.0, particles-min: 1, particles-max: 1}
    blue:
